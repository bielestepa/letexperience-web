<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LET Experience — Astrología · negocio vivo · diseño de vida</title><meta name="description" content="Astrología psicológica, negocio vivo y diseño de vida con Leticia Díaz. Comprende tu mapa, lee tu momento y conviértelo en dirección."><link rel="canonical" href="https://letexperience.com/"><link rel="stylesheet" href="styles/part1.css"><link rel="stylesheet" href="styles/part2.css"><link rel="stylesheet" href="styles/part3.css"></head><body><div id="site"></div><script>const files=['sections/header.html','sections/hero.html','sections/services.html','sections/about.html','sections/newsletter.html','sections/testimonials.html','sections/footer.html'];const imageBase='https://cdn.jsdelivr.net/gh/bielestepa/letexperience-web@main/';async function loadB64(path){const urls=[path,imageBase+path];for(const url of urls){try{const r=await fetch(url,{cache:'no-store'});if(r.ok)return(await r.text()).trim()}catch(e){}}throw new Error('No se pudo cargar '+path)}function b64Bytes(b64){const clean=b64.replace(/\s+/g,'');const bin=atob(clean);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}function bytesToBlobUrl(parts,type='image/webp'){const total=parts.reduce((n,p)=>n+p.length,0),out=new Uint8Array(total);let offset=0;for(const p of parts){out.set(p,offset);offset+=p.length}return URL.createObjectURL(new Blob([out],{type}))}Promise.all(files.map(f=>fetch(f).then(r=>r.text()))).then(async a=>{document.querySelector('#site').innerHTML=a.join('');await Promise.all([...document.querySelectorAll('img[data-b64]')].map(async i=>{try{const paths=i.dataset.b64.split(',');const parts=await Promise.all(paths.map(async p=>b64Bytes(await loadB64(p))));i.src=bytesToBlobUrl(parts);i.removeAttribute('data-b64')}catch(e){console.error('Error cargando imagen',e)}}));const b=document.querySelector('.menu-btn'),n=document.querySelector('.navlinks');if(b&&n){b.addEventListener('click',()=>{n.classList.toggle('open');b.setAttribute('aria-expanded',n.classList.contains('open')?'true':'false')});n.querySelectorAll('a').forEach(x=>x.addEventListener('click',()=>{n.classList.remove('open');b.setAttribute('aria-expanded','false')}))}document.querySelectorAll('[data-year]').forEach(e=>e.textContent=new Date().getFullYear())})</script></body></html>
