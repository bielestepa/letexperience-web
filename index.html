<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LET Experience — Astrología · negocio vivo · diseño de vida</title><meta name="description" content="Astrología psicológica, negocio vivo y diseño de vida con Leticia Díaz. Comprende tu mapa, lee tu momento y conviértelo en dirección."><link rel="canonical" href="https://letexperience.com/"><link rel="stylesheet" href="styles/part1.css"><link rel="stylesheet" href="styles/part2.css"><link rel="stylesheet" href="styles/part3.css"></head><body><div id="site"></div><script>const files=['sections/header.html','sections/hero.html','sections/services.html','sections/about.html','sections/newsletter.html','sections/testimonials.html','sections/footer.html'];Promise.all(files.map(f=>fetch(f).then(r=>r.text()))).then(a=>{document.querySelector('#site').innerHTML=a.join('');document.querySelectorAll('img[data-b64]').forEach(async i=>{try{const ps=i.dataset.b64.split(',');const b=(await Promise.all(ps.map(async p=>(await (await fetch(p)).text()).trim()))).join('');i.src='data:image/webp;base64,'+b}catch(e){}});const b=document.querySelector('.menu-btn'),n=document.querySelector('.navlinks');if(b&&n){b.addEventListener('click',()=>{n.classList.toggle('open');b.setAttribute('aria-expanded',n.classList.contains('open')?'true':'false')});n.querySelectorAll('a').forEach(x=>x.addEventListener('click',()=>{n.classList.remove('open');b.setAttribute('aria-expanded','false')}))}document.querySelectorAll('[data-year]').forEach(e=>e.textContent=new Date().getFullYear())})</script></body></html>
