<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LET Experience — Astrología · negocio vivo · diseño de vida</title><meta name="description" content="Astrología psicológica, negocio vivo y diseño de vida con Leticia Díaz. Comprende tu mapa, lee tu momento y conviértelo en dirección."><link rel="canonical" href="https://letexperience.com/"><link rel="stylesheet" href="styles/part1.css"><link rel="stylesheet" href="styles/part2.css"><link rel="stylesheet" href="styles/part3.css"></head><body><div id="site"></div><script>const files=['sections/header.html','sections/hero.html','sections/services.html','sections/about.html','sections/newsletter.html','sections/testimonials.html','sections/footer.html'];const bases=['https://cdn.jsdelivr.net/gh/bielestepa/letexperience-web@main/','https://raw.githubusercontent.com/bielestepa/letexperience-web/main/'];async function loadText(path){for(const url of [path,...bases.map(b=>b+path)]){try{const r=await fetch(url,{cache:'no-store'});if(r.ok)return(await r.text()).trim()}catch(e){}}throw new Error('No se pudo cargar '+path)}async function loadB64(path){return loadText(path)}function cleanB64(s){return s.replace(/\s+/g,'').replace(/^data:image\/webp;base64,/,'')}function b64ToBlobUrl(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let n=0;n<bin.length;n++)bytes[n]=bin.charCodeAt(n);return URL.createObjectURL(new Blob([bytes],{type:'image/webp'}))}Promise.all(files.map(f=>loadText(f))).then(async a=>{document.querySelector('#site').innerHTML=a.join('');await Promise.all([...document.querySelectorAll('img[data-b64]')].map(async i=>{try{const paths=i.dataset.b64.split(',').map(s=>s.trim()).filter(Boolean);const parts=await Promise.all(paths.map(loadB64));const b64=parts.map(cleanB64).join('');if(!b64)throw new Error('Base64 vacío');const url=b64ToBlobUrl(b64);i.src=url;await new Promise((resolve,reject)=>{i.onload=resolve;i.onerror=()=>reject(new Error('El navegador no pudo decodificar la imagen'))});i.removeAttribute('data-b64')}catch(e){console.error('Error cargando imagen',e)}}));const b=document.querySelector('.menu-btn'),n=document.querySelector('.navlinks');if(b&&n){b.addEventListener('click',()=>{n.classList.toggle('open');b.setAttribute('aria-expanded',n.classList.contains('open')?'true':'false')});n.querySelectorAll('a').forEach(x=>x.addEventListener('click',()=>{n.classList.remove('open');b.setAttribute('aria-expanded','false')}))}document.querySelectorAll('[data-year]').forEach(e=>e.textContent=new Date().getFullYear())}).catch(e=>console.error('Error cargando la página',e))</script></body></html>
